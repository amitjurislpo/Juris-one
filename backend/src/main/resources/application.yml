# Everything comes from the environment (or the project's .env, loaded by DotEnvEnvironmentPostProcessor).
# No secret has a default here.
server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: none     # X-Forwarded-For is read as-is (RequestMeta), like the Next.js app

spring:
  application:
    name: jurisone-backend
  # spring.datasource.url/username/password are derived from DATABASE_URL unless SPRING_DATASOURCE_* are set
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # the schema is owned by Flyway; never update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        auto_quote_keyword: true    # columns named "to", "key", "before", "after"
  flyway:
    baseline-on-migrate: true       # existing (Prisma-created) databases are baselined at V1, not re-migrated
    baseline-version: 1
    baseline-description: Prisma schema (4 migrations up to 20261006193828_tax_parents_senior)
  jackson:
    default-property-inclusion: always   # data keeps explicit nulls, like the TS responses (ApiResult omits its own empty fields)
    serialization:
      write-dates-as-timestamps: false

jurisone:
  frontend-origin: ${FRONTEND_ORIGIN:${APP_URL:http://localhost:3005}}
  # Absence marking, monthly lock, status changes, leave accrual/expiry/year end: every 10 minutes in this process.
  # "false" = run them from cron instead.
  jobs-enabled: ${JOBS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
