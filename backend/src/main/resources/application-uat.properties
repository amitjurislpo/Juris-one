# UAT: user acceptance testing. Secrets are ${PLACEHOLDERS}: set these environment variables on the server.
#   DB_PASSWORD  PII_ENCRYPTION_KEY (openssl rand -base64 32)  JWT_SECRET (openssl rand -base64 48)
#   SUPER_ADMIN_PASSWORD  SMTP_USER  SMTP_PASS
# Use a DIFFERENT PII key and JWT secret in every environment. Never change the PII key once data exists.
# The API refuses to start here with demo data, an http:// app-url, a fixed sign-in code or a missing secret.

jurisone.env=uat
logging.level.com.jurislpo.jurisone=INFO

server.port=8100

spring.datasource.url=jdbc:postgresql://localhost:5456/jurisone_uat?currentSchema=public
spring.datasource.username=jurisone
spring.datasource.password=${DB_PASSWORD}

jurisone.app-url=https://uat.people.example.com

# Per-business addresses (off unless TENANT_HOST_ENABLED=true): <business code>.${TENANT_BASE_DOMAIN}. The real domain is decided at deployment; none is kept in git.
jurisone.tenant-host.enabled=${TENANT_HOST_ENABLED:false}
jurisone.tenant-host.enforce=${TENANT_HOST_ENFORCE:true}
jurisone.tenant-host.base-domain=${TENANT_BASE_DOMAIN:}
jurisone.tenant-host.admin-label=${TENANT_ADMIN_LABEL:admin}

jurisone.security.pii-encryption-key=${PII_ENCRYPTION_KEY}
# Retired keys, comma-separated, only while a key rotation is in progress (read old data; new data always uses PII_ENCRYPTION_KEY). Empty otherwise.
jurisone.security.pii-encryption-previous-keys=${PII_ENCRYPTION_PREVIOUS_KEYS:}
# Stage 1 of encrypting employee names and designations (dual-write); turn on after V32 is applied, then run encrypt-existing.
jurisone.security.encrypt-names.dual-write=${ENCRYPT_NAMES_DUAL_WRITE:false}
# Employee email (encrypted copy + blind index): own key, and four switches that are all off (plaintext fallback on) until the owner turns them on in order.
jurisone.security.email-blind-index-key=${EMAIL_BLIND_INDEX_KEY:}
jurisone.security.encrypt-email.dual-write=${ENCRYPT_EMAIL_DUAL_WRITE:false}
jurisone.security.encrypt-email.lookup-by-blind-index=${ENCRYPT_EMAIL_LOOKUP_BY_BLIND_INDEX:false}
jurisone.security.encrypt-email.plaintext-fallback=${ENCRYPT_EMAIL_PLAINTEXT_FALLBACK:true}
jurisone.security.encrypt-email.read-encrypted=${ENCRYPT_EMAIL_READ_ENCRYPTED:false}
jurisone.security.jwt-secret=${JWT_SECRET}
jurisone.security.session-ttl-days=30

# no fixed sign-in code: real random codes, emailed
jurisone.otp.fixed-code=

jurisone.seed.super-admin-email=admin@jurislpo.com
jurisone.seed.demo=false

jurisone.mail.host=smtp.example.com
jurisone.mail.port=587
jurisone.mail.user=${SMTP_USER}
jurisone.mail.pass=${SMTP_PASS}
jurisone.mail.from=JurisOne (UAT) <no-reply@jurislpo.com>

# Generated and uploaded files (payslips, proofs, policy PDFs, onboarding files): a persistent folder outside the project,
# included in the backups. Override with the STORAGE_DIR environment variable.
jurisone.storage-dir=${STORAGE_DIR:/var/lib/jurisone/uat}

# JurisOne to JurisTrack gateway (/api/juris-track/**): off unless JURISTRACK_ENABLED=true. When on, the API refuses to start
# without JURISTRACK_BASE_URL (JurisTrack's internal address) and JURISTRACK_PRIVATE_KEY (RSA, PKCS#8; JurisTrack holds the public key).
jurisone.juristrack.enabled=${JURISTRACK_ENABLED:false}
jurisone.juristrack.base-url=${JURISTRACK_BASE_URL:}
jurisone.juristrack.issuer=${JURISTRACK_ISSUER:${jurisone.app-url}}
jurisone.juristrack.audience=${JURISTRACK_AUDIENCE:juristrack}
jurisone.juristrack.token-ttl-seconds=${JURISTRACK_TOKEN_TTL_SECONDS:300}
jurisone.juristrack.private-key=${JURISTRACK_PRIVATE_KEY:}
