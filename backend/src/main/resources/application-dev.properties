# DEV: local development. Verbose logs. Everything here is a local-only value (nothing is a real secret),
# so this one file is all the dev environment needs.

jurisone.env=dev
logging.level.com.jurislpo.jurisone=DEBUG

server.port=8080

# Postgres from docker-compose (npm run db:up): host port 5436
spring.datasource.url=jdbc:postgresql://localhost:5436/jurisone?currentSchema=public
spring.datasource.username=jurisone
spring.datasource.password=jurisone_dev_pw

# The web app's public URL
jurisone.app-url=http://localhost:3005

# 32 random bytes, base64: encrypts PAN / Aadhaar / UAN / phone / address / bank account at rest.
# Changing it makes existing encrypted data unreadable (run npm run db:reset after changing it in dev).
jurisone.security.pii-encryption-key=+R4tUi6tUMczCFAdAIisMzB9OX2kePXBhYVPjcMUwD4=
# Signs the 5-minute JWT access tokens (HS256), at least 32 bytes
jurisone.security.jwt-secret=Q0zpjqbR2AgsxPxt3L4XpQP3ABHCCyxvyuc6wCC1x9vgB+9BHNeg551G8SFJbBVJ
jurisone.security.session-ttl-days=30

# Only dev may use a fixed sign-in code. sqe, uat and prd leave it empty: real random codes, emailed.
jurisone.otp.fixed-code=000000

# npm run db:seed
jurisone.seed.super-admin-email=admin@jurislpo.com
# Demo business with sample people (dev and sqe only)
jurisone.seed.demo=false

# Empty host: emails are written to the email_outbox table and the server log (the sign-in code is printed there)
jurisone.mail.host=
jurisone.mail.user=
jurisone.mail.pass=
jurisone.mail.from=JurisOne (DEV) <no-reply@jurislpo.com>

# Generated and uploaded files (payslips, proofs, policy PDFs, onboarding files): your Documents/JurisOne folder
jurisone.storage-dir=${user.home}/Documents/JurisOne

# JurisOne to JurisTrack gateway (/api/juris-track/**). JurisTrack runs on :8081 and expects issuer = this app's URL.
jurisone.juristrack.enabled=true
jurisone.juristrack.base-url=http://localhost:8081
jurisone.juristrack.issuer=${jurisone.app-url}
jurisone.juristrack.audience=juristrack
jurisone.juristrack.token-ttl-seconds=300
# LOCAL-ONLY RSA private key (PKCS#8, base64): signs the tokens JurisTrack verifies with the matching public key.
# Never use it outside dev; sqe, uat and prd take their own key from the JURISTRACK_PRIVATE_KEY environment variable.
jurisone.juristrack.private-
