# JurisOne API: settings shared by every environment.
# Each environment adds its own in application-<env>.properties (dev, sqe, uat, prd); the active one is chosen by
# SPRING_PROFILES_ACTIVE (npm run ... sets it; default dev). Secrets of sqe, uat and prd are NOT in these files:
# they are ${PLACEHOLDERS} filled from the server's environment variables.

spring.profiles.default=dev
spring.application.name=jurisone-backend

server.port=8080
# X-Forwarded-For is read as-is (RequestMeta)
server.forward-headers-strategy=none

# spring.datasource.url / username / password: see application-<env>.properties
spring.jpa.open-in-view=false
# the schema is owned by Flyway; never update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# columns named "to", "key", "before", "after"
spring.jpa.properties.hibernate.auto_quote_keyword=true

# existing (Prisma-created) databases are baselined at V1, not re-migrated
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Prisma schema (4 migrations up to 20261006193828_tax_parents_senior)

# proof uploads: the size rule (tax.policy maxProofMb) is checked in code with its own message
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# data keeps explicit nulls (ApiResult omits its own empty fields)
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ── JurisOne ──
# The only origin the API accepts requests from (CORS and the Origin check): the web app's public URL
jurisone.frontend-origin=${jurisone.app-url}
# code requests per 15 minutes
jurisone.otp.requests-per-ip=10
jurisone.otp.requests-per-email=5
# Absence marking, monthly lock, status changes, leave accrual/expiry/year end: every 10 minutes in this process.
# false = run them from cron instead (java -jar ... jobs)
jurisone.jobs-enabled=true
jurisone.security.session-ttl-days=30
jurisone.mail.port=587
# Where payslip PDFs, investment proofs, policy PDFs and onboarding files are stored: a folder OUTSIDE the project,
# set per environment (jurisone.storage-dir in application-<env>.properties; default: Documents/JurisOne of the user running the API).

# JurisOne to JurisTrack roster sync (only when jurisone.juristrack.enabled=true): a full resync of every business that has Juris Track
# every this many minutes (0 = never, also at startup); a change to one business's people is pushed after this many milliseconds of quiet.
jurisone.juristrack.roster-sync-minutes=360
jurisone.juristrack.roster-debounce-millis=2000
