# SQE: shared test environment. Secrets are ${PLACEHOLDERS}: set these environment variables on the server.
#   DB_PASSWORD  PII_ENCRYPTION_KEY (openssl rand -base64 32)  JWT_SECRET (openssl rand -base64 48)
#   SUPER_ADMIN_PASSWORD  SEED_OWNER_PASSWORD  SEED_DEMO_PASSWORD  SMTP_USER  SMTP_PASS
# Use a DIFFERENT PII key and JWT secret in every environment. Never change the PII key once data exists.

jurisone.env=sqe
logging.level.com.jurislpo.jurisone=INFO

server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5446/jurisone_sqe?currentSchema=public
spring.datasource.username=jurisone
spring.datasource.password=${DB_PASSWORD}

jurisone.app-url=http://localhost:3015

jurisone.security.pii-encryption-key=${PII_ENCRYPTION_KEY}
jurisone.security.jwt-secret=${JWT_SECRET}
jurisone.security.session-ttl-days=30

# no fixed sign-in code: real random codes, emailed
jurisone.otp.fixed-code=

jurisone.seed.super-admin-email=admin@jurislpo.com
jurisone.seed.super-admin-password=${SUPER_ADMIN_PASSWORD}
# Demo business with sample people (dev and sqe only)
jurisone.seed.demo=true
jurisone.seed.owner-password=${SEED_OWNER_PASSWORD}
jurisone.seed.demo-password=${SEED_DEMO_PASSWORD}

jurisone.mail.host=smtp.example.com
jurisone.mail.port=587
jurisone.mail.user=${SMTP_USER}
jurisone.mail.pass=${SMTP_PASS}
jurisone.mail.from=JurisOne (SQE) <no-reply@jurislpo.com>

jurisone.upload-dir=./storage/sqe
