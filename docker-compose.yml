# One stack per environment, configured by that environment's file (never hard-code credentials here):
#   docker compose --env-file .env.<dev|sqe|uat|prd> up -d db        (or: npm run db:up / db:up:sqe / db:up:uat / db:up:prd)
# COMPOSE_PROJECT_NAME, the ports and the credentials all come from the env file, so each environment gets its own
# containers and data volume and they can run side by side.
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-jurisone}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: UTC
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - jurisone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot API (BACKEND_PORT on the host, 8080 inside). The web app (juris-one-frontend) proxies /api/* to it.
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-jurisone}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env.dev}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${APP_URL:-http://localhost:3005}
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/data/storage   # payslip PDFs and investment proofs

volumes:
  jurisone_pg:
