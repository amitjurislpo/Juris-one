# Postgres (and, optionally, the API) in Docker. The defaults below are for development:
#   docker compose up -d db                 # Postgres 16 on 127.0.0.1:5436, then run the API with Maven (see README)
#   docker compose up -d --build backend    # the API in Docker too (APP_ENV=dev)
# Other environments run side by side by setting these variables (shell, systemd or a CI job), e.g. for sqe:
#   COMPOSE_PROJECT_NAME=jurisone-sqe APP_ENV=sqe DB_PORT=5446 BACKEND_PORT=8090 POSTGRES_DB=jurisone_sqe \
#   POSTGRES_PASSWORD=... PII_ENCRYPTION_KEY=... JWT_SECRET=... docker compose up -d
# Each project name gets its own containers and volumes. The API's settings are in the jar's
# application-<env>.properties; only the database address and the secrets are passed here.
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-jurisone}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jurisone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisone_dev_pw}   # dev default; set it for every other environment
      POSTGRES_DB: ${POSTGRES_DB:-jurisone}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - jurisone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot API (BACKEND_PORT on the host, 8080 inside). The web app (juris-one-frontend) proxies /api/v1/* to it.
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-jurisone}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jurisone}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jurisone}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jurisone_dev_pw}
      # secrets of sqe / uat / prd (dev has its own values in application-dev.properties)
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - jurisone_files:/app/data/files   # payslip PDFs, investment proofs, policy PDFs, onboarding files

volumes:
  jurisone_pg:
  jurisone_files:
